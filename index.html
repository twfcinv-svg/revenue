<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>供應鏈樹圖＋合併營收組合圖</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="left">
        <strong>供應鏈視覺化</strong>
      </div>
      <div class="right controls">
        <input id="stockInput" type="text" placeholder="輸入股票代號或公司名稱（例如：2330 或 台積電）" />
        <select id="monthSelect"></select>
        <select id="metricSelect">
          <option value="MoM">MoM</option>
          <option value="YoY">YoY</option>
        </select>
        <select id="colorMode">
          <option value="redPositive">紅漲綠跌</option>
          <option value="greenPositive">綠漲紅跌</option>
        </select>
        <button id="runBtn">查詢</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="resultChip"></section>

    <div class="grid2">
      <section>
        <h3 class="sec-title">上游</h3>
        <div class="chart-wrap"><svg id="upTreemap" style="width:100%;height:560px"></svg></div>
        <div id="upHint" class="hint"></div>
      </section>
      <section>
        <h3 class="sec-title">下游</h3>
        <div class="chart-wrap"><svg id="downTreemap" style="width:100%;height:560px"></svg></div>
        <div id="downHint" class="hint"></div>
      </section>
    </div>

    <!-- 合併營收 + 月增/年增 組合圖 -->
    <section id="revComboSection" style="margin-top:12px;">
      <div style="display:flex; align-items:center; gap:12px; margin: 6px 8px;">
        <h3 style="margin:0; font-size:14px; color:#0f172a;">合併營收（柱）＋ 月增 / 年增（線）</h3>
        <div id="revComboLegend" style="font-size:12px; color:#334155;">
          <span style="display:inline-flex;align-items:center;margin-right:10px;">
            <i style="width:10px;height:4px;background:#3b82f6;display:inline-block;margin-right:5px;border-radius:2px;"></i>合併營收
          </span>
          <span style="display:inline-flex;align-items:center;margin-right:10px;">
            <i style="width:10px;height:0;border-top:2px solid #f59e0b;display:inline-block;margin-right:5px;"></i>年增率 YoY
          </span>
          <span style="display:inline-flex;align-items:center;">
            <i style="width:10px;height:0;border-top:2px solid #06b6d4;display:inline-block;margin-right:5px;"></i>月增率 MoM
          </span>
        </div>
      </div>
      <div id="revComboWrap" style="position:relative; width:100%; height:320px;">
        <svg id="revComboSvg" style="width:100%; height:100%;"></svg>
      </div>
      <div id="revComboHint" class="hint" style="margin: 4px 8px 0;"></div>
    </section>
  </main>

  <!-- libs -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- app -->
  <script src="./app.js"></script>
</body>
</html>
